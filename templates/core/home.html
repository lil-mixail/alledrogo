{% extends "base.html" %}
{% block title %}Strona główna{% endblock %}
{% block content %}
<section class="rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 px-8 py-12 text-white">
  <h1 class="text-4xl font-extrabold">Alledrogo</h1>
  <p class="mt-2 max-w-xl text-orange-50">Prosty sklep internetowy. Kupuj, komentuj i pisz ze sprzedawcami.</p>
  <div class="mt-6 flex gap-3">
    <a href="{% url 'products:list' %}" class="rounded-md bg-white px-4 py-2 font-medium text-orange-700 hover:bg-orange-50">Przeglądaj produkty</a>
    {% if not user.is_authenticated %}
      <a href="{% url 'accounts:register' %}" class="rounded-md border border-white/70 px-4 py-2 font-medium hover:bg-white/10">Załóż konto</a>
    {% endif %}
  </div>
</section>
{% endblock %}
