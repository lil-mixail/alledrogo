{% for msg in chat_messages %}
  <div class="flex {% if msg.sender_id == user.pk %}justify-end{% endif %}">
    <div class="max-w-[75%] rounded-lg px-3 py-2 text-sm {% if msg.sender_id == user.pk %}bg-orange-600 text-white{% else %}bg-slate-100{% endif %}">
      <p class="whitespace-pre-line break-words">{{ msg.body }}</p>
      <p class="mt-1 text-[10px] opacity-70">{{ msg.sender.username }} · {{ msg.created_at|date:"d.m H:i" }}</p>
    </div>
  </div>
{% empty %}
  <p class="text-center text-sm text-slate-400">Brak wiadomości. Napisz pierwszą!</p>
{% endfor %}
