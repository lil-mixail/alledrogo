{% extends "base.html" %}
{% block title %}Zmiana hasła{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="mb-6 text-2xl font-bold">Zmiana hasła</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_form.html" %}
    <button type="submit" class="w-full rounded-md bg-orange-600 py-2 font-medium text-white hover:bg-orange-700">Zmień hasło</button>
  </form>
</div>
{% endblock %}
