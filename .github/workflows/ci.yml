# CI: na kazdy PR do main odpalamy testy na takim samym Postgresie jak w RDS

name: ci

on:
  pull_request:
    branches: [main]

# CI nie potrzebuje AWS ani zapisu do repo
permissions:
  contents: read

# nowy push do PR anuluje stary przebieg
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  testy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alledrogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alledrogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # ktos zmienil model i nie dodal migracji -> czerwone
      - name: migracje
        run: python manage.py makemigrations --check --dry-run

      - name: testy
        run: python manage.py test
