# CD: po merge do main budujemy nowe AMI i podmieniamy serwery w ASG
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token potrzebny do logowania do AWS przez OIDC (bez kluczy w sekretach)
permissions:
  id-token: write
  contents: read

# dwa deploye naraz by sie gryzly
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE: arn:aws:iam::663252309407:role/alledrogo-github-deploy
  LT_NAME: alledrogo-app-lt
  ASG_NAME: alledrogo-app-asg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: testy
        env:
          DJANGO_SECRET_KEY: ci-only
          DJANGO_DEBUG: "True"
          DATABASE_URL: sqlite:///ci.db
        run: python manage.py test

  build-ami:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.ami.outputs.ami_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.11.2"

      # kod z tego commita, bez .git i bez plikow spoza repo (.env itp.)
      - name: paczka z kodem
        run: git archive --format=tar.gz -o deploy/packer/app.tar.gz HEAD

      - name: packer build
        working-directory: deploy/packer
        run: |
          packer init .
          packer build -var "git_sha=${GITHUB_SHA}" .

      - name: id nowego AMI
        id: ami
        working-directory: deploy/packer
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "Nowe AMI: $AMI_ID" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-ami
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # nowa wersja launch template = poprzednia + nowe AMI
      - name: launch template
        env:
          AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
        run: |
          VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "$LT_NAME" \
            --source-version '$Latest' \
            --version-description "github ${GITHUB_SHA::7}" \
            --launch-template-data "{\"ImageId\":\"$AMI_ID\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' --output text)
          aws ec2 modify-launch-template --launch-template-name "$LT_NAME" --default-version "$VERSION"
          echo "Launch template $LT_NAME: wersja $VERSION z $AMI_ID" >> "$GITHUB_STEP_SUMMARY"

      # serwery wymieniane po jednym, min. 50% zdrowych caly czas
      - name: instance refresh
        run: |
          REFRESH=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300,"SkipMatching":true}' \
            --query InstanceRefreshId --output text)
          echo "refresh: $REFRESH"
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "$(date +%T) $STATUS"
            case "$STATUS" in
              Successful) echo "Deploy OK" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 30
          done
          echo "timeout"; exit 1
